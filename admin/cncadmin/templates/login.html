{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:60px auto">
  <h1>CNC File Server</h1>
  {% if not configured %}
  <p class="flash error">No admin password is set. On the Pi run:<br>
    <span class="mono">docker compose run --rm cnc-admin python -m cncadmin.cli set-admin-password</span></p>
  {% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" value="admin" autocomplete="username">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" autofocus>
    <div class="actions"><button>Log in</button></div>
  </form>
</div>
{% endblock %}
