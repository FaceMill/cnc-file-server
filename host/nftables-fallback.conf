#!/usr/sbin/nft -f
# Loaded only if the generated ruleset (generated/nftables.conf) is missing or invalid
# at boot. Keeps SSH on the office port so the Pi can be fixed; everything else closed.
flush ruleset

table inet filter {
	chain input {
		type filter hook input priority 0; policy drop;
		iif lo accept
		ct state established,related accept
		meta l4proto { icmp, ipv6-icmp } limit rate 10/second accept
		iifname "eth0" tcp dport 22 accept
	}
	chain forward {
		type filter hook forward priority 0; policy drop;
	}
	chain output {
		type filter hook output priority 0; policy accept;
	}
}
