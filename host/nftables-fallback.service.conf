# systemd drop-in for nftables.service (installed by host/install.sh):
# load the fallback ruleset if the generated one fails.
[Service]
ExecStart=
ExecStart=/bin/sh -c '/usr/sbin/nft -f /etc/nftables.conf || { echo "generated firewall failed, loading fallback" >&2; /usr/sbin/nft -f /etc/nftables-fallback.conf; }'
