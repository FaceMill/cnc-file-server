# CNC file server. All configuration is managed by cnc-admin (https://<pi>:8443),
# which writes generated/* from config/site.json and restarts what changed.
# All services use host networking; the host nftables firewall (generated by
# cnc-admin) is the only firewall.

# Built images use the host network for RUN steps: Docker's own iptables/NAT is
# disabled on the Pi, so the default build bridge has no internet access.
x-samba: &samba
  build: {context: ./samba, network: host}
  image: local/cnc-samba:1.0
  network_mode: host
  restart: unless-stopped
  env_file: .env
  # Root in the container must not be able to sniff the office or CNC network.
  cap_drop: [NET_RAW]

services:
  samba-office:
    <<: *samba
    container_name: samba-office
    environment:
      SMB_ROLE: office
    volumes:
      - /srv/cnc:/srv/cnc
      - ./generated:/etc/cnc:ro

  samba-cnc:
    <<: *samba
    container_name: samba-cnc
    environment:
      SMB_ROLE: cnc
    volumes:
      - /srv/cnc:/srv/cnc
      - ./generated:/etc/cnc:ro

  ftp-cnc:
    build: {context: ./ftp, network: host}
    image: local/cnc-ftp:1.0
    container_name: ftp-cnc
    network_mode: host
    restart: unless-stopped
    env_file: .env
    cap_drop: [NET_RAW]
    volumes:
      - /srv/cnc:/srv/cnc
      - ./generated:/etc/cnc:ro

  # FANUC FOCAS (Ethernet program transfer). FANUC's library has no 64-bit ARM build, so
  # on a Pi this is a 32-bit ARM container; on an x86-64 PC it's linux/amd64 (FOCAS_PLATFORM
  # in .env, set by host/install.sh). Listens on 127.0.0.1:8095 and only answers requests that
  # carry the shared token, i.e. from cnc-admin. See focas/lib/README.md about the
  # library's licence.
  focas-bridge:
    build: {context: ./focas, network: host}
    image: local/cnc-focas:1.0
    platform: ${FOCAS_PLATFORM:-linux/arm/v7}
    container_name: focas-bridge
    network_mode: host
    restart: unless-stopped
    cap_drop: [NET_RAW]
    volumes:
      - ./config/focas-token:/run/secrets/focas-token:ro

  cnc-admin:
    build: {context: ./admin, network: host}
    image: local/cnc-admin:1.0
    container_name: cnc-admin
    network_mode: host
    restart: unless-stopped
    env_file: .env
    # Manages the host firewall and network (NET_ADMIN, D-Bus), restarts
    # containers (Docker socket) and drives RS-232 DNC (USB serial adapters).
    # Effectively root on the Pi: protect its password.
    cap_add:
      - NET_ADMIN
    device_cgroup_rules:
      - "c 188:* rmw"   # ttyUSB* (FTDI, Prolific, CH340 adapters)
      - "c 166:* rmw"   # ttyACM*
    volumes:
      # Whole /dev so USB serial adapters can be added later; /dev/serial/by-id gives stable names.
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - ./config:/app/config
      - ./generated:/app/generated
      - /srv/cnc:/srv/cnc
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket

  caddy:
    image: caddy:2.11.7
    container_name: caddy
    network_mode: host
    restart: unless-stopped
    env_file: .env
    cap_drop: [NET_RAW]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data

  # Optional, off by default: Portainer is full control of Docker (= root on the Pi).
  # Start with `docker compose --profile portainer up -d portainer`; it listens on the
  # Pi itself only. Reach it through an SSH tunnel:
  #   ssh -L 9443:127.0.0.1:9443 <user>@<pi>   then open https://localhost:9443
  portainer:
    image: portainer/portainer-ce:2.21.4
    container_name: portainer
    profiles: ["portainer"]
    network_mode: host
    restart: unless-stopped
    command: ["--bind", "127.0.0.1:9000", "--bind-https", "127.0.0.1:9443", "--tunnel-addr", "127.0.0.1"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/portainer:/data
